{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}

<div style="max-width:400px; margin:60px auto;">
    <div style="text-align:center; margin-bottom:30px;">
        <div style="font-size:60px; color:#6C63FF; margin-bottom:15px;">
            <i class="fas fa-store"></i>
        </div>
        <h1 style="font-size:24px;">ورود کسب‌وکار</h1>
    </div>

    <form method="post">
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <div class="form-group">
            <label><i class="fas fa-user-circle"></i> نام کاربری</label>
            <input type="text" name="username" placeholder="نام کاربری" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> رمز عبور</label>
            <input type="password" name="password" placeholder="رمز عبور" required>
        </div>

        <button type="submit" style="width:100%; justify-content:center;">
            <i class="fas fa-sign-in-alt"></i> ورود
        </button>
    </form>

    <div style="text-align:center; margin-top:20px; display:flex; flex-direction:column; gap:10px;">
        <a href="/register" style="color:#6C63FF;">حساب نداری؟ ثبت‌نام کن</a>
        <a href="/forgot" style="color:#888; font-size:14px;">نام کاربری یا رمزت رو فراموش کردی؟</a>
    </div>
</div>

{% endblock %}
